name: Build Android APK

# Run it by hand: GitHub > Actions > "Build Android APK" > Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner already has the Android SDK; accept licenses and make sure platform 34 is there.
      - name: Android SDK
        run: |
          set -e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # The signing key lives in repository secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD). It is never printed or uploaded.
      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "Missing secrets KEYSTORE_BASE64 / KEYSTORE_PASSWORD"; exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=threeeo" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: 3eo-android-apk
          path: app/build/outputs/apk/release/*.apk

      # Also keep the signed APK on its own branch so it can be fetched without the Actions UI.
      - name: Publish APK to branch apk-builds
        run: |
          set -e
          VN=$(grep -m1 versionName app/build.gradle | sed "s/.*'\(.*\)'.*/\1/")
          mkdir -p "$RUNNER_TEMP/apk"
          cp app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/apk/3eo-seo-$VN-build${{ github.run_number }}.apk"
          cd "$RUNNER_TEMP/apk"
          git init -q && git checkout -q -b apk-builds
          git config user.name "github-actions" && git config user.email "actions@users.noreply.github.com"
          git add . && git commit -qm "APK $VN build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk-builds
