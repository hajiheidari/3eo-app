name: App Store screenshots (sample data)

# Builds the app for the simulator, runs it in demo mode (invented sample data, no network)
# and pushes the raw screenshots to the "shots" branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] || { echo "No Xcode 26+"; exit 1; }
          sudo xcode-select -s "$X/Contents/Developer"

      - name: Generate project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick a 6.9-inch simulator
        id: sim
        run: |
          xcrun simctl list devices available | grep -E "iPhone .*(Pro Max|Plus)" | head -5
          ID=$(xcrun simctl list devices available | grep -E "iPhone 1[67] Pro Max" | tail -1 | grep -oE '[0-9A-F-]{36}')
          [ -n "$ID" ] || ID=$(xcrun simctl list devices available | grep -E "iPhone .*Pro Max" | tail -1 | grep -oE '[0-9A-F-]{36}')
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "Using $ID"

      - name: Build for simulator
        working-directory: ios
        run: |
          xcodebuild -project ThreeEO.xcodeproj -scheme ThreeEO -sdk iphonesimulator \
            -destination "id=${{ steps.sim.outputs.id }}" -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO build

      - name: Take screenshots
        run: |
          ID=${{ steps.sim.outputs.id }}
          xcrun simctl boot "$ID" || true
          xcrun simctl bootstatus "$ID" -b
          xcrun simctl status_bar "$ID" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
          APP=$(find "$RUNNER_TEMP/dd" -name "ThreeEO.app" -path "*iphonesimulator*" | head -1)
          xcrun simctl install "$ID" "$APP"
          mkdir -p shots
          for S in rank monitor home report pro content blog reports; do
            xcrun simctl terminate "$ID" com.espadna.seo || true
            xcrun simctl launch "$ID" com.espadna.seo -demo -screen $S
            sleep 14
            xcrun simctl io "$ID" screenshot "shots/$S.png"
            if [ "$S" = rank ] || [ "$S" = monitor ]; then
              xcrun simctl spawn "$ID" log show --last 2m --style compact --predicate 'process == "ThreeEO"' | tail -60 > "shots/log-$S.txt" || true
              ls ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i threeeo > "shots/crash-$S.txt" || true
              for f in ~/Library/Logs/DiagnosticReports/ThreeEO*.ips; do head -c 6000 "$f" > "shots/crashdump-$S.txt"; done 2>/dev/null || true
            fi
          done
          file shots/*.png

      - name: Push screenshots to the shots branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan shots
          git rm -rf . >/dev/null 2>&1 || true
          git add -f shots
          git commit -m "screenshots"
          git push -f origin shots
