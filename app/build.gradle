plugins {
    id 'com.android.application'
}

def buildNumber = Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')

android {
    namespace 'ir.threeeo.app'
    compileSdk 34

    defaultConfig {
        applicationId 'ir.threeeo.app'
        minSdk 21
        targetSdk 34
        // every GitHub build gets a higher number automatically (stores need it to grow)
        versionCode buildNumber
        versionName '1.7.0'
    }

    signingConfigs {
        release {
            if (System.getenv('KEYSTORE_FILE')) {
                storeFile file(System.getenv('KEYSTORE_FILE'))
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('KEYSTORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // appcompat/swiperefreshlayout pull two kotlin-stdlib versions; pin one
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
